<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão de Visita - KADRON</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Exo 2', sans-serif;
    gap: 40px;
    padding: 40px 20px;
  }

  h2 {
    color: #888;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .card-wrapper {
    perspective: 1200px;
    width: 400px;
    height: 240px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-wrapper:hover .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
  }

  /* FRENTE */
  .card-front {
    background: #0f0f0f;
    border: 1px solid #2a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 32px;
  }

  .card-front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #cc0000, #ff3333, #cc0000, transparent);
  }

  .card-front::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #550000, transparent);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #cc0000;
    text-transform: uppercase;
  }

  .corner-mark {
    width: 20px;
    height: 20px;
    border-top: 2px solid #cc0000;
    border-right: 2px solid #cc0000;
    opacity: 0.6;
  }

  .person-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
  }

  .person-title {
    font-size: 11px;
    color: #cc0000;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .skills-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .skill-tag {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #888;
    border: 1px solid #2a2a2a;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
  }

  .skill-tag.highlight {
    color: #cc0000;
    border-color: #440000;
  }

  .contacts {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.5px;
  }

  .contact-icon {
    width: 14px;
    height: 14px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  /* VERSO */
  .card-back {
    background: #080808;
    border: 1px solid #1a0000;
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
  }

  .card-back::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, #1a0000 0%, transparent 70%);
    pointer-events: none;
  }

  .card-back::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #cc0000, #ff3333, #cc0000, transparent);
  }

  .logo-img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(204, 0, 0, 0.5));
    position: relative;
    z-index: 1;
  }

  .kadron-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #ffffff;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }

  .tagline {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 3px;
    color: #666;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }

  .tagline span {
    color: #cc0000;
  }

  /* Print layout */
  .print-section {
    display: flex;
    gap: 32px;
    align-items: center;
  }

  .label {
    color: #333;
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 8px;
  }

  .hint {
    color: #333;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    margin-top: 16px;
    font-style: italic;
  }
</style>
</head>
